<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AIMEGANE THE SALE 2026 — P2</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=Bodoni+Moda:opsz,wght@6..96,900&family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Noto Sans JP', sans-serif;
      background: #F5EAD8;
      padding-top: 54px;
    }

    /* ── NAV ── */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      height: 54px; padding: 0 16px;
      display: flex; align-items: center; justify-content: space-between;
      background: #fff;
      border-bottom: 1px solid #e8e8e8;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }
    .nav-logo img { height: 32px; width: auto; display: block; }

    /* ── 右端フロートCTAタブ：非表示 ── */
    .side-cta { display: none; }

    /* ── FV：ナビ除いた全画面 ── */
    .fv {
      position: relative;
      height: calc(100vh - 54px);
      height: calc(100dvh - 54px);
      overflow: hidden;
    }

    /* 写真：フルブリード */
    .fv-bg {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
    }
    .fv-bg img {
      width: 100%; height: 100%;
      object-fit: cover;
      object-position: center center;
      transform: scale(1.15) translateY(-5%);
      display: block;
    }
    /* 中央楕円オーバーレイ */
    .fv-bg::before {
      content: '';
      position: absolute; inset: 0; z-index: 1;
      background: radial-gradient(
        ellipse 80% 75% at 50% 46%,
        rgba(250,243,232,0.97) 0%,
        rgba(250,243,232,0.88) 32%,
        rgba(250,243,232,0.50) 60%,
        transparent 100%
      );
    }

    /* テキストエリア */
    .fv-text {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center;
      padding: 16px 24px 16px 24px;
      z-index: 5;
    }

    /* キャッチコピー */
    .catch {
      font-family: 'Noto Sans JP', sans-serif;
      font-size: 12px; font-weight: 400; letter-spacing: 0.25em;
      color: #5a3a20;
      margin-bottom: 8px;
    }

    /* THE */
    .t-the {
      display: block;
      font-family: 'Playfair Display', serif; font-weight: 700;
      font-size: clamp(60px, 15vw, 90px);
      letter-spacing: 0.22em; line-height: 1;
      background: linear-gradient(to bottom, #E8352A 0%, #C42020 45%, #831212 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      filter: drop-shadow(0 1px 2px rgba(120,20,20,0.18));
    }
    /* SALE */
    .t-sale {
      display: block;
      font-family: 'Playfair Display', serif; font-weight: 900;
      font-size: clamp(106px, 28vw, 158px);
      letter-spacing: 0.08em; line-height: 0.88;
      margin-bottom: 14px;
      background: linear-gradient(to bottom, #E8352A 0%, #C42020 45%, #831212 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      filter: drop-shadow(0 2px 6px rgba(120,20,20,0.22));
    }

    /* 区切り線：ゴールド */
    .rule {
      width: 52px; height: 1px;
      background: linear-gradient(to right, transparent, #C5A24A, transparent);
      margin: 0 auto 12px;
    }

    /* 30%OFF */
    .disc {
      display: flex; align-items: baseline; justify-content: center;
      margin-bottom: 16px;
    }
    .d-pre {
      font-family: 'Noto Sans JP', sans-serif;
      font-size: 13px; font-weight: 400; color: #B03228;
      letter-spacing: 0.1em; padding-bottom: 8px; margin-right: 4px;
    }
    .d-num {
      font-family: 'Bodoni Moda', serif; font-weight: 900;
      font-size: clamp(130px, 34vw, 190px); line-height: 1;
      background: linear-gradient(to bottom, #E8352A 0%, #C42020 45%, #831212 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      filter: drop-shadow(0 3px 8px rgba(120,20,20,0.25));
    }
    .d-suf {
      display: flex; flex-direction: column; align-self: flex-end;
      padding-bottom: 12px; margin-left: 4px;
    }
    .d-pct, .d-off {
      font-family: 'Playfair Display', serif; font-weight: 700;
      font-size: clamp(42px, 11vw, 64px); line-height: 1;
      background: linear-gradient(to bottom, #E8352A 0%, #C42020 45%, #831212 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      filter: drop-shadow(0 1px 3px rgba(120,20,20,0.20));
    }

    /* 日付エリア */
    .period { margin-bottom: 16px; }
    .p-date {
      display: inline-block;
      font-family: 'Playfair Display', serif; font-weight: 700;
      color: #192444; font-size: 15px; letter-spacing: 0.06em;
      white-space: nowrap;
      background: rgba(255,252,245,0.95);
      border: 1.5px solid rgba(197,162,74,0.70);
      padding: 8px 20px; border-radius: 999px;
      box-shadow: 0 3px 14px rgba(0,0,0,0.13);
      margin-bottom: 6px;
    }
    .p-note {
      font-family: 'Noto Sans JP', sans-serif;
      font-size: 10px; font-weight: 400; letter-spacing: 0.15em;
      color: #7a5535;
      display: block;
    }
    /* 下部CTAボタン */
    .fv-cta {
      display: inline-flex; align-items: center; justify-content: center; gap: 10px;
      margin-top: 18px;
      background: #B03228; color: #F7EEDC;
      font-family: 'Noto Sans JP', sans-serif;
      font-size: 14px; font-weight: 500; letter-spacing: 0.20em;
      padding: 15px 48px; border-radius: 2px;
      text-decoration: none;
      box-shadow: 0 4px 18px rgba(176,50,40,0.35);
      transition: background 0.3s;
    }
    .fv-cta:hover { background: #8a2420; }
    .fv-cta::after {
      content: ''; display: block; width: 6px; height: 6px;
      border-right: 2px solid #F7EEDC; border-top: 2px solid #F7EEDC;
      transform: rotate(45deg);
    }
  </style>
</head>
<body>

  <nav>
    <div class="nav-logo">
      <img src="images/aimegane_yoko_3.jpg" alt="アイメガネ">
    </div>
  </nav>

  <a href="https://www.aimegane.com/booking-search/" class="side-cta">ご来店予約</a>

  <section class="fv">

    <div class="fv-bg">
      <img src="イメージ画像/e589fc6a-7128-40df-8c21-07282db2e6b4.png" alt="アイメガネ THE SALE">
    </div>

    <div class="fv-text">
      <p class="catch">年に一度の、特別な出会いを。</p>
      <span class="t-the">THE</span>
      <span class="t-sale">SALE</span>
      <div class="rule"></div>
      <div class="disc">
        <span class="d-pre">最大</span>
        <span class="d-num">30</span>
        <div class="d-suf">
          <span class="d-pct">%</span>
          <span class="d-off">OFF</span>
        </div>
      </div>
      <div class="period">
        <p class="p-date">2026.8.8<small>（土）</small> &mdash; 10.12<small>（月）</small></p>
        <span class="p-note">※ 10.12はスポーツの日</span>
      </div>
      <a href="https://www.aimegane.com/booking-search/" class="fv-cta">📅 来店予約はこちら</a>
    </div>

  </section>

</body>
</html>
