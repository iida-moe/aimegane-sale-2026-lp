<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AIMEGANE THE SALE 2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,700;0,800;0,900;1,300;1,400&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Noto Sans JP', sans-serif; overflow-x: hidden; }

    /* ──────────────────────────────────────────
       アナウンスバー：最初の一行で「年に一度」を刻む
    ────────────────────────────────────────── */
    .announce {
      background: #0E0808;
      height: 32px; padding: 0 24px;
      display: flex; align-items: center; justify-content: center; gap: 18px;
    }
    .ann-txt { font-size: 11px; letter-spacing: 0.24em; color: rgba(255,255,255,0.52); }
    .ann-hl  { font-size: 11px; letter-spacing: 0.16em; font-weight: 700; color: #FFD000; }
    .ann-sep { color: rgba(255,255,255,0.16); }

    /* ──────────────────────────────────────────
       ナビゲーション
    ────────────────────────────────────────── */
    .nav {
      position: sticky; top: 0; z-index: 100;
      height: 58px; padding: 0 clamp(20px,3.5vw,56px);
      display: flex; align-items: center; justify-content: space-between;
      background: #fff; border-bottom: 3px solid #B80020;
    }
    .nav-logo {
      font-family: 'Barlow', sans-serif; font-weight: 800;
      font-size: clamp(12px,1.3vw,16px); letter-spacing: 0.26em;
      color: #1A1A1A; text-transform: uppercase;
    }
    .nav-logo em { font-style: normal; color: #B80020; }
    .nav-btn {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: clamp(10px,0.9vw,12px); font-weight: 700;
      letter-spacing: 0.20em; padding: 10px 26px;
      background: #B80020; color: #fff;
      text-decoration: none; transition: background 0.15s;
    }
    .nav-btn:hover { background: #8B0016; }

    /* ──────────────────────────────────────────
       FV コンテナ：flex-column で下部ストリップを固定
    ────────────────────────────────────────── */
    .fv {
      width: 100%;
      height: calc(100dvh - 90px); /* announce:32 + nav:58 */
      min-height: 500px;
      display: flex; flex-direction: column;
    }

    /* ── メインエリア（左右） ── */
    .fv-main {
      flex: 1;
      position: relative; overflow: hidden;
    }

    /* ──────────────────────────────────────────
       左パネル：赤帯 — THE SALE → 30%OFF → 期間
       ここはシンプルに。特典は下のストリップで「発見」させる
    ────────────────────────────────────────── */
    .fv-left {
      position: absolute;
      top: 0; left: 0; bottom: 0;
      width: 52%;
      background: #B80020;
      clip-path: polygon(0 0, 100% 0, 76% 100%, 0 100%);
      z-index: 1;
      display: flex; flex-direction: column; justify-content: center;
      padding:
        clamp(16px,2vw,28px)
        clamp(60px,13vw,188px)
        clamp(16px,2vw,28px)
        clamp(32px,4.5vw,68px);
    }

    .fv-the {
      display: block;
      font-family: 'Barlow', sans-serif; font-style: italic; font-weight: 300;
      font-size: clamp(16px,1.9vw,27px); letter-spacing: 0.18em; line-height: 1;
      color: rgba(255,255,255,0.46); margin-bottom: -3px;
    }
    .fv-sale {
      display: block;
      font-family: 'Barlow', sans-serif; font-weight: 900;
      font-size: clamp(78px,9.2vw,132px); line-height: 0.84;
      letter-spacing: 0.01em; color: #fff;
      text-shadow: 0 4px 24px rgba(0,0,0,0.16);
      margin-bottom: clamp(10px,1.2vw,18px);
    }

    .fv-target {
      display: inline-block; align-self: flex-start;
      font-size: clamp(9px,0.80vw,11px); font-weight: 700;
      letter-spacing: 0.22em; color: rgba(255,255,255,0.80);
      border: 1px solid rgba(255,255,255,0.38);
      padding: 3px 12px;
      margin-bottom: clamp(4px,0.5vw,8px);
    }
    .fv-max {
      display: block;
      font-family: 'Barlow', sans-serif; font-weight: 700;
      font-size: clamp(10px,1vw,14px); letter-spacing: 0.54em;
      color: rgba(255,255,255,0.50); margin-bottom: -4px;
    }
    .fv-num-row {
      display: flex; align-items: flex-end; gap: 1px;
      margin-bottom: clamp(12px,1.5vw,20px);
    }
    /* 「30」が画面最大の要素。黄色×赤地 = 最大コントラスト */
    .fv-num {
      font-family: 'Barlow', sans-serif; font-weight: 900;
      font-size: clamp(106px,12vw,170px); line-height: 0.78;
      color: #FFD000; letter-spacing: -0.03em;
      text-shadow:
        0 0 40px rgba(255,208,0,0.55),
        0 2px 16px rgba(255,208,0,0.30);
    }
    .fv-suf {
      display: flex; flex-direction: column; align-self: flex-end;
      padding-bottom: clamp(10px,1.2vw,17px); margin-left: -4px;
    }
    .fv-pct {
      font-family: 'Barlow', sans-serif; font-weight: 900;
      font-size: clamp(42px,4.6vw,64px); line-height: 0.86;
      color: #FFD000; text-shadow: 0 0 18px rgba(255,208,0,0.40);
    }
    .fv-off {
      font-family: 'Barlow', sans-serif; font-weight: 900;
      font-size: clamp(34px,3.7vw,52px); line-height: 0.94; color: #fff;
    }
    .fv-sep {
      height: 1px; flex-shrink: 0;
      background: linear-gradient(90deg, rgba(255,255,255,0.30) 0%, transparent 75%);
      margin-bottom: clamp(8px,1vw,14px);
    }
    .fv-date-block { display: flex; flex-direction: column; gap: 2px; }
    .fv-date-label {
      font-size: clamp(10px,0.85vw,12px); font-weight: 700;
      letter-spacing: 0.44em; color: rgba(255,255,255,0.44);
    }
    .fv-date {
      font-family: 'Barlow', sans-serif; font-weight: 700;
      font-size: clamp(12px,1.4vw,20px); letter-spacing: 0.04em;
      color: #fff;
    }

    /* ──────────────────────────────────────────
       右パネル：商品写真
       ウォームクリーム地 + スポットライト + ヴィネット
    ────────────────────────────────────────── */
    .fv-right {
      position: absolute;
      top: 0; right: 0; bottom: 0;
      width: 62%;
      background: #EEE9E4;
      z-index: 0; overflow: hidden;
    }
    .fv-right img {
      width: 100%; height: 100%;
      object-fit: contain; object-position: 46% center;
      display: block; position: relative; z-index: 1;
      transform: scale(1.04);
      filter: contrast(1.08) saturate(1.12);
    }
    /* 中心スポットライト（商品に光が当たる） */
    .fv-right::before {
      content: ''; position: absolute; inset: 0; z-index: 2; pointer-events: none;
      background: radial-gradient(
        ellipse 54% 60% at 50% 44%,
        rgba(255,252,248,0.78) 0%,
        rgba(255,252,248,0.20) 42%,
        transparent 68%
      );
    }
    /* 周辺ヴィネット（奥行き・高級感） */
    .fv-right::after {
      content: ''; position: absolute; inset: 0; z-index: 3; pointer-events: none;
      background:
        radial-gradient(ellipse at 0%   50%, rgba(238,233,228,0.85) 0%, transparent 26%),
        radial-gradient(ellipse at 100%  4%, rgba(238,233,228,0.75) 0%, transparent 28%),
        radial-gradient(ellipse at 100% 96%, rgba(238,233,228,0.70) 0%, transparent 28%),
        radial-gradient(ellipse at 50%   0%, rgba(238,233,228,0.55) 0%, transparent 18%),
        radial-gradient(ellipse at 50% 100%, rgba(238,233,228,0.60) 0%, transparent 18%);
    }
    .fv-disclaimer {
      position: absolute; bottom: 10px; right: 14px;
      font-size: 10px; letter-spacing: 0.06em; color: rgba(0,0,0,0.26);
      z-index: 4;
    }

    /* ──────────────────────────────────────────
       チケット型ストリップ
    ────────────────────────────────────────── */
    .fv-strip {
      flex-shrink: 0;
      background: #7A0018;
      min-height: clamp(80px,8.5vw,112px);
      padding: clamp(8px,1vw,14px) clamp(20px,3.5vw,52px);
      display: flex; align-items: center;
      gap: clamp(12px,2vw,28px);
      border-top: 1px solid rgba(255,255,255,0.07);
    }

    /* 見出し部（左端） */
    .fv-strip-intro {
      flex-shrink: 0;
      display: flex; flex-direction: column;
      align-items: center; gap: 4px;
    }
    .fv-strip-star { color: #FFD000; font-size: 12px; line-height: 1; }
    .fv-strip-heading {
      font-size: clamp(9px,0.82vw,11px); font-weight: 700;
      letter-spacing: 0.22em; color: rgba(255,255,255,0.70);
      white-space: nowrap;
    }
    .fv-strip-vline {
      width: 1px; height: 36px; flex-shrink: 0;
      background: rgba(255,255,255,0.22);
    }

    /* チケット群 */
    .fv-tickets {
      flex: 1; display: flex;
      gap: 4px; align-items: stretch;
      min-height: clamp(58px,6.2vw,82px);
    }

    /* 個別チケット */
    .fv-ticket {
      flex: 1; position: relative;
      background: #fff;
      display: flex; align-items: center;
      padding: 0 clamp(14px,1.8vw,22px);
      gap: clamp(8px,1vw,14px);
      overflow: visible;
    }
    /* 半円ノッチ（左右） */
    .fv-ticket::before,
    .fv-ticket::after {
      content: '';
      position: absolute;
      width: 16px; height: 16px;
      border-radius: 50%;
      background: #7A0018;
      top: 50%; transform: translateY(-50%);
      z-index: 1;
    }
    .fv-ticket::before { left: -8px; }
    .fv-ticket::after  { right: -8px; }

    /* 番号バッジ */
    .fv-ticket-num {
      width: clamp(22px,2.4vw,30px);
      height: clamp(22px,2.4vw,30px);
      border-radius: 50%;
      background: #B80020; color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Barlow', sans-serif; font-weight: 900;
      font-size: clamp(10px,1.05vw,13px); letter-spacing: 0;
      flex-shrink: 0;
    }

    /* テキスト部 */
    .fv-ticket-body {
      display: flex; flex-direction: column; gap: 1px;
      min-width: 0;
    }
    .fv-ticket-cond {
      font-size: clamp(9px,0.80vw,11px); font-weight: 700;
      letter-spacing: 0.06em; color: #666;
      white-space: nowrap;
    }
    .fv-ticket-deal {
      display: flex; align-items: baseline; gap: 1px;
      color: #B80020;
    }
    .fv-ticket-deal .val {
      font-family: 'Barlow', sans-serif; font-weight: 900;
      font-size: clamp(20px,2.4vw,32px); line-height: 1;
      letter-spacing: -0.02em;
    }
    .fv-ticket-deal .unit {
      font-size: clamp(10px,1vw,13px); font-weight: 700;
    }
    .fv-ticket-deal .yen {
      font-size: clamp(11px,1.1vw,14px); font-weight: 700;
      align-self: flex-end; padding-bottom: 2px;
    }

    /* CTA ボタン */
    .fv-cta {
      flex-shrink: 0;
      display: inline-flex; align-items: center; gap: 9px;
      padding: clamp(11px,1.3vw,14px) clamp(22px,2.5vw,36px);
      background: #fff; color: #B80020;
      font-size: clamp(11px,1vw,13px); font-weight: 700;
      letter-spacing: 0.18em; text-decoration: none; white-space: nowrap;
      box-shadow: 0 4px 20px rgba(0,0,0,0.28);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .fv-cta:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(0,0,0,0.36); }
    .fv-cta-arr { font-size: 18px; font-weight: 300; line-height: 1; }
  </style>
</head>
<body>

  <!-- アナウンスバー：「年に一度のお祭り」の緊急性をページ冒頭で刻む -->
  <div class="announce">
    <span class="ann-txt">年に一度の大型セール</span>
    <span class="ann-sep">|</span>
    <span class="ann-hl">2026.8.8（土）— 10.12（月）</span>
    <span class="ann-sep">|</span>
    <span class="ann-txt">全国アイメガネ各店舗にて開催</span>
  </div>

  <!-- ナビ -->
  <nav class="nav">
    <span class="nav-logo">ai <em>Aimegane</em></span>
    <a href="#" class="nav-btn">ご来店予約 ›</a>
  </nav>

  <!-- FV -->
  <section class="fv">

    <!-- メインエリア：左に訴求テキスト、右に商品写真 -->
    <div class="fv-main">

      <!-- 左：THE SALE → MAX 30%OFF → 期間
           ここでは特典を見せない（ストリップで「発見」させる） -->
      <div class="fv-left">
        <span class="fv-the">The</span>
        <span class="fv-sale">SALE</span>
        <span class="fv-target">メガネ・サングラス全品</span>
        <span class="fv-max">M A X</span>
        <div class="fv-num-row">
          <span class="fv-num">30</span>
          <div class="fv-suf">
            <span class="fv-pct">%</span>
            <span class="fv-off">OFF</span>
          </div>
        </div>
        <div class="fv-sep"></div>
        <div class="fv-date-block">
          <span class="fv-date-label">期 間 限 定</span>
          <span class="fv-date">2026.8.8（土）— 10.12（月）</span>
        </div>
      </div>

      <!-- 右：商品写真（スポットライト＋ヴィネットで高級感） -->
      <div class="fv-right">
        <img src="FV.png" alt="アイメガネ セール対象 メガネ・サングラス">
        <p class="fv-disclaimer">※画像はイメージです</p>
      </div>

    </div>

    <!-- チケット型ストリップ：「えっ、3つも特典がある！」の瞬間 -->
    <div class="fv-strip">

      <!-- 見出し -->
      <div class="fv-strip-intro">
        <span class="fv-strip-star">✦</span>
        <span class="fv-strip-heading">さらにお得な特典</span>
      </div>
      <div class="fv-strip-vline"></div>

      <!-- チケット3枚 -->
      <div class="fv-tickets">

        <div class="fv-ticket">
          <span class="fv-ticket-num">01</span>
          <div class="fv-ticket-body">
            <span class="fv-ticket-cond">処方箋持参で</span>
            <div class="fv-ticket-deal">
              <span class="yen">¥</span>
              <span class="val">1,100</span>
              <span class="unit">引き</span>
            </div>
          </div>
        </div>

        <div class="fv-ticket">
          <span class="fv-ticket-num">02</span>
          <div class="fv-ticket-body">
            <span class="fv-ticket-cond">LINE友だち登録で</span>
            <div class="fv-ticket-deal">
              <span class="yen">¥</span>
              <span class="val">1,100</span>
              <span class="unit">引き</span>
            </div>
          </div>
        </div>

        <div class="fv-ticket">
          <span class="fv-ticket-num">03</span>
          <div class="fv-ticket-body">
            <span class="fv-ticket-cond">２本目（安い方）</span>
            <div class="fv-ticket-deal">
              <span class="val">20</span>
              <span class="unit">%OFF</span>
            </div>
          </div>
        </div>

      </div>

      <!-- CTA -->
      <a href="#" class="fv-cta">まずは予約する <span class="fv-cta-arr">›</span></a>

    </div>

  </section>

</body>
</html>
