<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AIMEGANE THE SALE 2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,700;0,800;0,900;1,300;1,400&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Noto Sans JP', sans-serif; background: #fff; overflow-x: hidden; }

    /* ── ナビ ── */
    .nav {
      height: 56px; padding: 0 clamp(20px,3.5vw,56px);
      display: flex; align-items: center; justify-content: space-between;
      background: #fff; border-bottom: 2px solid #B80020;
    }
    .nav-logo {
      font-family: 'Barlow', sans-serif; font-weight: 800;
      font-size: clamp(12px,1.3vw,16px); letter-spacing: 0.24em;
      text-transform: uppercase; color: #1A1A1A;
    }
    .nav-logo em { font-style: normal; color: #B80020; }
    .nav-btn {
      font-size: clamp(10px,0.9vw,12px); font-weight: 700; letter-spacing: 0.18em;
      padding: 8px 20px; border: 1.5px solid #B80020; color: #B80020;
      background: transparent; text-decoration: none;
    }

    /* ── FV ── */
    .fv {
      position: relative; overflow: hidden;
      width: 100%;
      height: clamp(580px,calc(100dvh - 56px),820px);
      background: #fff;
      display: flex;
    }

    /* 紙吹雪コンテナ */
    #confetti {
      position: absolute; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
    }

    /* ── 左カラム ── */
    .fv-left {
      flex: 0 0 54%; position: relative; z-index: 2;
      display: flex; flex-direction: column; justify-content: center;
      padding: clamp(20px,2.5vw,36px) clamp(16px,2vw,28px) clamp(20px,2.5vw,36px) clamp(40px,5vw,72px);
    }

    /* タグライン（＼ 年に一度のビッグチャンス！ ／） */
    .fv-tagline {
      display: flex; align-items: center; gap: 7px;
      font-size: clamp(11px,1.1vw,14px); font-weight: 500; color: #777;
      letter-spacing: 0.12em; margin-bottom: clamp(6px,0.7vw,10px);
    }
    .fv-tagline::before { content: '＼'; color: #aaa; font-weight: 400; }
    .fv-tagline::after  { content: '／'; color: #aaa; font-weight: 400; }

    /* THE SALE */
    .fv-headline {
      font-family: 'Barlow', sans-serif; font-weight: 900;
      font-size: clamp(58px,7.6vw,110px); line-height: 0.88;
      letter-spacing: 0.02em; color: #B80020;
      position: relative; z-index: 2;
      margin-bottom: 0;
    }

    /* ブラシストローク + 最大30%OFF */
    .fv-discount-wrap {
      position: relative;
      margin: clamp(-10px,-1vw,-5px) 0 clamp(14px,1.6vw,24px);
    }
    .fv-brush-svg {
      position: absolute;
      top: -28px; left: -48px;
      width: calc(86% + 68px);
      height: calc(100% + 52px);
      overflow: visible; z-index: 0;
    }
    .fv-discount-content {
      position: relative; z-index: 1;
      display: flex; align-items: flex-end;
      padding: clamp(6px,0.7vw,10px) 0;
    }
    .fv-saidai {
      font-size: clamp(20px,2.3vw,33px); font-weight: 900;
      color: #fff; letter-spacing: 0.04em;
      align-self: flex-end;
      padding-bottom: clamp(14px,1.8vw,26px);
      padding-right: 3px;
    }
    .fv-num {
      font-family: 'Barlow', sans-serif; font-weight: 900;
      font-size: clamp(94px,10.8vw,154px); line-height: 0.80;
      color: #fff; letter-spacing: -0.03em;
    }
    .fv-suf {
      display: flex; flex-direction: column; align-self: flex-end;
      padding-bottom: clamp(12px,1.4vw,20px); margin-left: 1px;
    }
    .fv-pct {
      font-family: 'Barlow', sans-serif; font-weight: 900;
      font-size: clamp(40px,4.5vw,62px); line-height: 0.86; color: #fff;
    }
    .fv-off {
      font-family: 'Barlow', sans-serif; font-weight: 900;
      font-size: clamp(30px,3.4vw,48px); line-height: 0.94; color: #fff;
    }

    /* 特典ボックス */
    .fv-perks-box {
      display: flex; align-items: stretch;
      border: 1.5px solid rgba(184,0,32,0.22);
      background: #fff;
      margin-bottom: clamp(14px,1.6vw,22px);
      align-self: flex-start;
      width: 100%; max-width: clamp(300px,36vw,490px);
      box-shadow: 0 2px 12px rgba(0,0,0,0.07);
    }
    .fv-perk-item {
      display: flex; align-items: center; gap: clamp(8px,1vw,12px);
      padding: clamp(10px,1.2vw,16px) clamp(12px,1.4vw,18px);
      flex: 1;
    }
    .fv-perk-item + .fv-perk-item { border-left: 1px solid rgba(184,0,32,0.18); }
    .perk-icon {
      width: 30px; height: 30px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      border: 1.5px solid rgba(184,0,32,0.35); border-radius: 4px;
    }
    .perk-icon svg { width: 17px; height: 17px; }
    .line-badge {
      width: 30px; height: 30px; flex-shrink: 0;
      background: #06C755; border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-size: 9px; font-weight: 900; color: #fff; letter-spacing: -0.05em;
    }
    .perk-text { font-size: clamp(9px,0.85vw,11px); color: #555; line-height: 1.35; }
    .perk-text strong {
      display: block;
      font-size: clamp(14px,1.55vw,21px); font-weight: 900; color: #B80020;
    }

    /* CTA */
    .fv-cta {
      display: inline-flex; align-items: center; gap: clamp(8px,1vw,12px);
      align-self: flex-start;
      padding: clamp(13px,1.5vw,18px) clamp(22px,2.6vw,38px);
      background: #7A0018; color: #fff;
      font-size: clamp(12px,1.2vw,16px); font-weight: 700; letter-spacing: 0.14em;
      text-decoration: none; margin-bottom: clamp(14px,1.8vw,24px);
      transition: background 0.15s;
    }
    .fv-cta:hover { background: #5E000E; }
    .cta-arr { font-size: 20px; font-weight: 300; line-height: 1; }

    /* 下部フィーチャー */
    .fv-features {
      display: flex; gap: clamp(10px,1.8vw,24px);
      border-top: 1px solid rgba(0,0,0,0.08);
      padding-top: clamp(10px,1.2vw,16px);
    }
    .fv-feature {
      display: flex; align-items: flex-start; gap: 7px;
      font-size: clamp(9px,0.80vw,11px); color: #666; line-height: 1.55;
    }
    .feat-icon { font-size: 15px; flex-shrink: 0; margin-top: 1px; }

    /* ── 右カラム ── */
    .fv-right {
      flex: 0 0 46%; position: relative; z-index: 1;
    }
    .fv-right img {
      width: 100%; height: 100%;
      object-fit: contain;
      object-position: left center;
      filter: contrast(1.08) saturate(1.10);
    }

    /* 金色スタンプバッジ */
    .fv-stamp {
      position: absolute;
      top: clamp(16px,3vw,44px); right: clamp(12px,2.5vw,36px);
      width: clamp(80px,9vw,118px); height: clamp(80px,9vw,118px);
      border-radius: 50%;
      background: radial-gradient(circle at 35% 32%, #FFEE7A, #D4940A);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center;
      box-shadow:
        0 4px 18px rgba(200,148,0,0.55),
        inset 0 2px 5px rgba(255,255,255,0.65),
        inset 0 -2px 5px rgba(0,0,0,0.12);
      border: 2.5px solid rgba(170,120,0,0.65);
      z-index: 3; transform: rotate(10deg);
      gap: 1px;
    }
    .stamp-main {
      font-size: clamp(11px,1.2vw,16px); font-weight: 900;
      color: #4A2000; letter-spacing: 0.06em; line-height: 1.2;
    }
    .stamp-sub {
      font-family: 'Barlow', sans-serif; font-style: italic; font-weight: 700;
      font-size: clamp(9px,0.88vw,12px); color: #6A3800; letter-spacing: 0.04em;
    }
    .stamp-price {
      font-family: 'Barlow', sans-serif; font-style: italic; font-weight: 700;
      font-size: clamp(10px,1vw,14px); color: #4A2000; letter-spacing: 0.02em;
    }
  </style>
</head>
<body>

  <nav class="nav">
    <span class="nav-logo">ai <em>Aimegane</em></span>
    <a href="#" class="nav-btn">ご来店予約</a>
  </nav>

  <section class="fv">

    <!-- 紙吹雪（JSで生成） -->
    <div id="confetti" aria-hidden="true"></div>

    <!-- 左カラム -->
    <div class="fv-left">

      <!-- ＼ 年に一度のビッグチャンス！ ／ -->
      <p class="fv-tagline">年に一度のビッグチャンス！</p>

      <!-- THE SALE -->
      <h1 class="fv-headline">THE SALE</h1>

      <!-- ブラシストローク + 最大30%OFF -->
      <div class="fv-discount-wrap">

        <!-- インラインSVGブラシストローク -->
        <svg class="fv-brush-svg" viewBox="0 0 700 220" preserveAspectRatio="none" aria-hidden="true">
          <!-- メインストローク（不規則な有機的形状） -->
          <path d="
            M0,52
            C28,16 88,4 172,16
            C258,28 338,8 428,20
            C500,30 572,16 650,28
            C678,36 698,50 696,78
            C694,100 678,116 645,122
            C566,132 494,116 428,124
            C338,132 258,148 172,136
            C88,126 28,140 0,126
            Z
          " fill="#B80020"/>
          <!-- テクスチャ（ブラシ感を出す重ね） -->
          <path d="
            M4,62 C42,52 108,46 182,54 C258,62 338,50 422,58 C492,64 564,56 640,66 L642,80
            C564,72 492,80 422,74 C338,66 258,78 182,70 C108,62 42,72 4,68 Z
          " fill="#8B0014" opacity="0.40"/>
          <path d="
            M8,104 C46,116 108,110 176,118 C252,126 332,114 420,120 C490,126 562,116 638,124 L640,136
            C562,130 490,140 420,134 C332,128 252,142 176,132 C108,124 46,136 8,130 Z
          " fill="#CC1028" opacity="0.25"/>
        </svg>

        <!-- 最大 30% OFF テキスト（白・ブラシ上） -->
        <div class="fv-discount-content">
          <span class="fv-saidai">最大</span>
          <span class="fv-num">30</span>
          <div class="fv-suf">
            <span class="fv-pct">%</span>
            <span class="fv-off">OFF</span>
          </div>
        </div>
      </div>

      <!-- 特典ボックス -->
      <div class="fv-perks-box">
        <div class="fv-perk-item">
          <div class="perk-icon">
            <!-- クリップボードアイコン -->
            <svg viewBox="0 0 24 24" fill="none" stroke="#B80020" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="8" y="2" width="8" height="4" rx="1"/>
              <path d="M5 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-1"/>
              <line x1="9" y1="12" x2="15" y2="12"/>
              <line x1="9" y1="16" x2="13" y2="16"/>
            </svg>
          </div>
          <div class="perk-text">
            処方箋持参で
            <strong>1,100円引き</strong>
          </div>
        </div>
        <div class="fv-perk-item">
          <div class="line-badge">LINE</div>
          <div class="perk-text">
            LINE友だち追加で
            <strong>1,100円引き</strong>
          </div>
        </div>
      </div>

      <!-- CTA ボタン -->
      <a href="#" class="fv-cta">
        <!-- カレンダーアイコン -->
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="18" rx="2"/>
          <line x1="16" y1="2" x2="16" y2="6"/>
          <line x1="8" y1="2" x2="8" y2="6"/>
          <line x1="3" y1="10" x2="21" y2="10"/>
        </svg>
        来店予約はこちら
        <span class="cta-arr">›</span>
      </a>

      <!-- 下部フィーチャー3点 -->
      <div class="fv-features">
        <div class="fv-feature">
          <span class="feat-icon">👓</span>
          <span>豊富な品揃え<br>人気ブランド多数</span>
        </div>
        <div class="fv-feature">
          <span class="feat-icon">🏬</span>
          <span>全国の店舗で対応<br>お近くの店舗を選べます</span>
        </div>
        <div class="fv-feature">
          <span class="feat-icon">⭕</span>
          <span>安心のアフターケア<br>見え方のサポートも充実</span>
        </div>
      </div>

    </div>

    <!-- 右カラム：商品写真 -->
    <div class="fv-right">
      <img src="FV.png" alt="アイメガネ セール対象 メガネ・サングラス">

      <!-- 期間限定 金スタンプ -->
      <div class="fv-stamp">
        <span class="stamp-main">期間限定</span>
        <span class="stamp-sub">Special</span>
        <span class="stamp-price">Price!</span>
      </div>
    </div>

  </section>

  <script>
    // 紙吹雪を動的に生成
    (function () {
      var wrap = document.getElementById('confetti');
      var colors = [
        '#FFD700','#FFC107','#FFEE44',   // gold
        '#FF6B6B','#E53935','#FF4444',   // red
        '#64B5F6','#2196F3','#42A5F5',   // blue
        '#81C784','#4CAF50',             // green
        '#FF80AB','#F48FB1','#BA68C8'    // pink/purple
      ];
      var frag = document.createDocumentFragment();
      for (var i = 0; i < 100; i++) {
        var el = document.createElement('div');
        var w = 4 + Math.random() * 9;
        var isRound = Math.random() > 0.60;
        var rotation = Math.random() * 360;
        var color = colors[Math.floor(Math.random() * colors.length)];
        el.style.cssText =
          'position:absolute;' +
          'width:' + w + 'px;' +
          'height:' + (isRound ? w : (w * (1.4 + Math.random()))) + 'px;' +
          'background:' + color + ';' +
          'left:' + (Math.random() * 100) + '%;' +
          'top:' + (Math.random() * 100) + '%;' +
          'transform:rotate(' + rotation + 'deg);' +
          'opacity:' + (0.50 + Math.random() * 0.50) + ';' +
          'border-radius:' + (isRound ? '50%' : '2px') + ';';
        frag.appendChild(el);
      }
      wrap.appendChild(frag);
    })();
  </script>

</body>
</html>
