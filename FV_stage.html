<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AIMEGANE THE SALE 2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,700;0,800;0,900;1,300;1,400&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Noto Sans JP', sans-serif; }

    /* ── ナビ：クリーム地・透明感 ── */
    .nav {
      position: sticky; top: 0; z-index: 100;
      height: 58px; padding: 0 clamp(20px,3.5vw,56px);
      display: flex; align-items: center; justify-content: space-between;
      background: rgba(242,235,227,0.96);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(0,0,0,0.07);
    }
    .nav-logo {
      font-family: 'Barlow', sans-serif; font-weight: 800;
      font-size: clamp(12px,1.3vw,16px); letter-spacing: 0.26em;
      color: #1A1A1A; text-transform: uppercase;
    }
    .nav-logo em { font-style: normal; color: #B80020; }
    .nav-btn {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: clamp(10px,0.9vw,12px); font-weight: 700;
      letter-spacing: 0.20em; padding: 9px 24px;
      border: 2px solid #B80020; color: #B80020;
      background: transparent; text-decoration: none;
      transition: background 0.15s, color 0.15s;
    }
    .nav-btn:hover { background: #B80020; color: #fff; }

    /* ── FV コンテナ ── */
    .fv {
      position: relative;
      width: 100%;
      height: calc(100dvh - 58px);
      min-height: 500px;
      overflow: hidden;
      background: #F2EBE3;
      display: flex; flex-direction: column;
    }

    /* ── メインエリア ── */
    .fv-main {
      flex: 1;
      position: relative; overflow: hidden;
    }

    /* 商品写真ラッパー：左側に配置・アップ */
    .fv-img-wrap {
      position: absolute;
      top: 0; left: 0; bottom: 0;
      width: 66%;
      overflow: hidden;
    }
    .fv-img-wrap img {
      width: 100%; height: 100%;
      object-fit: cover;
      object-position: right center; /* FV.pngのメガネは右端に集中 */
      transform: scale(1.38);
      transform-origin: right center;
      filter: contrast(1.22) saturate(1.20) brightness(0.94);
    }

    /* 右からのグラデーション（テキストエリアのみ保護・左は透明でメガネを見せる） */
    .fv-grad {
      position: absolute; inset: 0; z-index: 1; pointer-events: none;
      background: linear-gradient(to left,
        #F2EBE3 36%,
        rgba(242,235,227,0.88) 46%,
        rgba(242,235,227,0.25) 54%,
        transparent 62%
      );
    }

    /* テキストコンテンツ：右側に配置 */
    .fv-content {
      position: absolute; z-index: 2;
      top: 0; right: 0; bottom: 0;
      width: 48%;
      display: flex; flex-direction: column; justify-content: center;
      padding:
        clamp(20px,2.5vw,36px)
        clamp(32px,5vw,72px)
        clamp(20px,2.5vw,36px)
        clamp(20px,2.5vw,32px);
    }

    /* 日付バッジ */
    .fv-date-badge {
      display: inline-flex; align-items: center; gap: 7px;
      align-self: flex-start;
      padding: 5px 14px;
      background: rgba(184,0,32,0.07);
      border: 1px solid rgba(184,0,32,0.28);
      font-size: clamp(10px,0.92vw,13px); font-weight: 700;
      letter-spacing: 0.14em; color: #B80020;
      margin-bottom: clamp(12px,1.5vw,22px);
    }
    .fv-date-badge::before { content: '◆'; font-size: 5px; opacity: 0.55; }

    /* The */
    .fv-the {
      display: block;
      font-family: 'Barlow', sans-serif; font-style: italic; font-weight: 300;
      font-size: clamp(18px,2.1vw,30px); letter-spacing: 0.16em; line-height: 1;
      color: rgba(184,0,32,0.56); margin-bottom: -6px;
    }
    /* SALE */
    .fv-sale {
      display: block;
      font-family: 'Barlow', sans-serif; font-weight: 900;
      font-size: clamp(80px,9.5vw,136px); line-height: 0.84;
      letter-spacing: 0.01em; color: #B80020;
      text-shadow: 0 2px 20px rgba(184,0,32,0.12);
      margin-bottom: clamp(12px,1.5vw,20px);
    }

    /* 対象バッジ */
    .fv-target {
      display: inline-block; align-self: flex-start;
      font-size: clamp(9px,0.82vw,11px); font-weight: 700;
      letter-spacing: 0.22em; color: #444;
      border: 1px solid rgba(0,0,0,0.20);
      padding: 3px 12px;
      margin-bottom: clamp(4px,0.5vw,8px);
    }
    /* MAX */
    .fv-max {
      display: block;
      font-family: 'Barlow', sans-serif; font-weight: 700;
      font-size: clamp(10px,1vw,14px); letter-spacing: 0.52em;
      color: rgba(184,0,32,0.50); margin-bottom: -4px;
    }
    /* 数字行 */
    .fv-num-row {
      display: flex; align-items: flex-end; gap: 1px;
    }
    /* 30 */
    .fv-num {
      font-family: 'Barlow', sans-serif; font-weight: 900;
      font-size: clamp(108px,12.5vw,176px); line-height: 0.78;
      color: #B80020; letter-spacing: -0.03em;
      text-shadow: 0 2px 20px rgba(184,0,32,0.15);
    }
    .fv-suf {
      display: flex; flex-direction: column; align-self: flex-end;
      padding-bottom: clamp(10px,1.2vw,18px); margin-left: -2px;
    }
    .fv-pct {
      font-family: 'Barlow', sans-serif; font-weight: 900;
      font-size: clamp(44px,4.8vw,66px); line-height: 0.86; color: #B80020;
    }
    .fv-off {
      font-family: 'Barlow', sans-serif; font-weight: 900;
      font-size: clamp(34px,3.8vw,54px); line-height: 0.94; color: #B80020;
    }

    /* ── ディスカバリーストリップ（下部）── */
    .fv-strip {
      flex-shrink: 0;
      height: clamp(64px,7vw,94px);
      background: #B80020;
      padding: 0 clamp(20px,3.5vw,56px);
      display: flex; align-items: center;
      gap: clamp(8px,1.4vw,22px);
      border-top: 1px solid rgba(255,255,255,0.06);
    }
    .fv-strip-label {
      font-size: clamp(9px,0.82vw,11px); font-weight: 700;
      letter-spacing: 0.26em; color: rgba(255,255,255,0.78);
      white-space: nowrap; flex-shrink: 0;
    }
    .fv-strip-line {
      width: 1px; height: 24px;
      background: rgba(255,255,255,0.25); flex-shrink: 0;
    }
    .fv-perks {
      flex: 1; display: flex; align-items: center;
      gap: clamp(6px,1.1vw,16px); overflow: hidden;
    }
    .fv-perk {
      display: flex; align-items: center; gap: 5px;
      font-size: clamp(10px,0.92vw,13px);
      color: rgba(255,255,255,0.90); letter-spacing: 0.04em; white-space: nowrap;
    }
    .fv-check {
      color: #FFD000; font-weight: 900;
      font-size: clamp(12px,1.1vw,15px); flex-shrink: 0;
    }
    .fv-perk strong { font-weight: 700; color: #fff; }
    .fv-pipe { color: rgba(255,255,255,0.20); font-size: 16px; flex-shrink: 0; }
    .fv-cta {
      flex-shrink: 0;
      display: inline-flex; align-items: center; gap: 9px;
      padding: clamp(11px,1.3vw,14px) clamp(24px,2.8vw,40px);
      background: #fff; color: #B80020;
      font-size: clamp(11px,1vw,13px); font-weight: 700;
      letter-spacing: 0.18em; text-decoration: none; white-space: nowrap;
      box-shadow: 0 4px 20px rgba(0,0,0,0.26);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .fv-cta:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(0,0,0,0.34); }
    .fv-cta-arr { font-size: 18px; font-weight: 300; line-height: 1; }
  </style>
</head>
<body>

  <!-- ナビ -->
  <nav class="nav">
    <span class="nav-logo">ai <em>Aimegane</em></span>
    <a href="#" class="nav-btn">ご来店予約 ›</a>
  </nav>

  <section class="fv">

    <div class="fv-main">

      <!-- 商品写真（左側・アップ） -->
      <div class="fv-img-wrap">
        <img src="FV.png" alt="アイメガネ セール対象 メガネ・サングラス">
      </div>

      <!-- 右からのグラデーション（テキスト可読性） -->
      <div class="fv-grad"></div>

      <!-- テキストコンテンツ -->
      <div class="fv-content">
        <span class="fv-date-badge">2026.8.8（土）— 10.12（月）</span>
        <span class="fv-the">The</span>
        <span class="fv-sale">SALE</span>
        <span class="fv-target">メガネ・サングラス全品</span>
        <span class="fv-max">M A X</span>
        <div class="fv-num-row">
          <span class="fv-num">30</span>
          <div class="fv-suf">
            <span class="fv-pct">%</span>
            <span class="fv-off">OFF</span>
          </div>
        </div>
      </div>

    </div>

    <!-- ディスカバリーストリップ：「えっ、さらにある！」の瞬間 -->
    <div class="fv-strip">
      <span class="fv-strip-label">✦ さらにお得な特典</span>
      <div class="fv-strip-line"></div>
      <div class="fv-perks">
        <div class="fv-perk">
          <span class="fv-check">✓</span>
          <span>処方箋持参で <strong>1,100円引き</strong></span>
        </div>
        <span class="fv-pipe">|</span>
        <div class="fv-perk">
          <span class="fv-check">✓</span>
          <span>LINEお友達登録で <strong>1,100円引き</strong></span>
        </div>
        <span class="fv-pipe">|</span>
        <div class="fv-perk">
          <span class="fv-check">✓</span>
          <span>２本目（安い方） <strong>20%OFF</strong></span>
        </div>
      </div>
      <a href="#" class="fv-cta">まずは予約する <span class="fv-cta-arr">›</span></a>
    </div>

  </section>

</body>
</html>
